  <script>
  /* ── 启动看门狗（修「有时候页面一堆英文乱码」）──────────────────────
   * 那段英文是构建期写进 #app 的 SEO 静态占位（给搜索引擎看的）。正常情况下
   * Vue 一挂载就会整体替换掉它；但一旦 JS 资源加载失败（版本更新后旧缓存指向
   * 已删除的 chunk、弱网超时等），占位就会一直裸露在用户面前。
   * 两道保险：
   *  1) vite:preloadError（chunk 404 等）→ 自动整页重载一次（sessionStorage 防循环）；
   *  2) 6 秒后仍未挂载成功 → 把英文占位换成中文提示 + 重试按钮，不再显示英文。 */
  (function () {
    /* 轮 30 / 轮 38：启动页只在 App 里显示（网页端 display:none 保持隐藏）。
       轮 38 修正：轮 30 只看 UA 里有没有 "capacitor"，而 Capacitor Android 的 WebView
       UA **默认不含这个串**（只有 capacitor.config.json 配了 android.appendUserAgent
       才会被追加）→ html.cap-app 永远加不上 → App 端启动页凭空消失（网页端隐藏是轮 30
       要的效果，App 端是它的副作用）。
       现在解析期就尽量判（早一点显示，少闪一帧），四路任一命中即算 App：
         ① window.androidBridge / window.Capacitor（电容壳注入，最硬）
         ② capacitor.config.json 里 android.appendUserAgent 配的串（确定会被追加到 UA）
         ③ UA 里的 "capacitor"（iOS 端带它）
         ④ src/main.js 里 Capacitor.isNativePlatform()（权威兜底，挂载前补判） */
    try {
      var ua = navigator.userAgent || "";
      var looksApp = !!window.androidBridge || !!window.Capacitor ||
        /capacitor|WarmPawsApp/i.test(ua);
      if (looksApp) {
        document.documentElement.classList.add("cap-app");
      }
    } catch (e) { /* 拿不到 UA 就当网页 */ }
    var FLAG = "wp-boot-reload";
    try {
      window.addEventListener("vite:preloadError", function () {
        if (sessionStorage.getItem(FLAG)) return;   /* 已重载过一次：不再循环 */
        sessionStorage.setItem(FLAG, "1");
        location.reload();
      });
    } catch (e) { /* 隐私模式等拿不到 sessionStorage 就跳过自动重载 */ }
    setTimeout(function () {
      if (window.__WP_MOUNTED__) return;
      var app = document.getElementById("app");
      /* 轮 24：看门狗触发时先摘掉启动页，否则中文提示会被启动页挡住 */
      var sp = document.getElementById("app-splash");
      if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
      /* 轮 18：不再要求「有英文占位才兜底」——App 里占位已被剥离（cap-strip-hero），
       * JS 起不来时同样给出中文提示，而不是白屏/裸英文 */
      if (!app) return;
      app.innerHTML =
        '<section class="card seo-hero" style="text-align:center">' +
        '<h2 class="seo-title">\u{1F43E} 温暖的爪印</h2>' +
        "<p>页面加载遇到了一点小麻烦，内容没有起来。</p>" +
        '<p><a href="javascript:location.reload()" style="color:#e07a3f;font-weight:700">' +
        "\u70b9\u8fd9\u91cc\u91cd\u8bd5</a></p></section>";
    }, 6000);
  })();
  </script>

  <!-- Open Graph（微信 / QQ / Discord 等分享卡片） -->

  <meta property="og:site_name" content="Warm Paws" />

  <!-- 结构化数据：帮助搜索引擎理解站点名称与类型 -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Warm Paws",
      "alternateName": "温暖的爪印",
      "url": "https://dale.de5.net/",
      "description": "A warm, healing corner: an adorable pet to care for, hand-drawn food, a gentle daily story and a cloud-shared kindness wall.",

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/style.css" />
</head>
<body>
  <div id="app"></div>

  <!-- 轮 24：启动页（静态层，不依赖 Vue）——覆盖「原生 splash 结束 → Vue 挂载 + 云端会话就绪」的白屏窗口。
       App.vue 在云端就绪（或 2.5s 兜底）并预热完会话缓存后加 .out 淡出移除；
       启动看门狗触发时会先摘掉它再放中文提示，避免提示被挡。 -->
  <div id="app-splash" aria-hidden="true">
    <style>
      /* 轮 38：这一块原来是坏的——轮 30 在样式块中间插入了一个 style 结束标签，把唯一的
       * 样式块提前闭合，后面 30 行 CSS 全成了「裸文本」（根本不在 style 元素里）。于是唯一
       * 生效的规则是 display:none → 启动页在 App 里也永远不显示，而 html.cap-app ...
       * display:flex 那条也一起变成了死文本（这才是「App 端启动页又没了」的真因）。
       * 现在合成一个合法样式块，顺序是有意的：
       *   ① 布局（这里不写 display）→ ② 默认隐藏（网页端不闪）→ ③ App 壳恢复显示（优先级更高）
       * 注意：注释里**不能出现**字面的 style 结束标签——HTML 解析器在 style 元素里见到它就
       * 立刻结束元素（注释也不豁免），splash-test ⑥/⑦ 就是守这个的。 */
      #app-splash { position: fixed; inset: 0; z-index: 9999; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px; background: #fff7ee;
        transition: opacity .4s ease; padding: 24px; text-align: center; }
      #app-splash { display: none; }
      /* html.cap-app 由 index.html 内联脚本 + src/main.js 的 Capacitor.isNativePlatform() 加上 */
      html.cap-app #app-splash { display: flex; }
      #app-splash.out { opacity: 0; pointer-events: none; }
      #app-splash .sp-paw { font-size: 56px; animation: sp-breathe 1.6s ease-in-out infinite; }
      #app-splash .sp-name { font-size: 22px; font-weight: 800; color: #6b4a32; }
      #app-splash .sp-sub { font-size: 12px; color: #a98d74; letter-spacing: 2px; }
      #app-splash .sp-tag { font-size: 13px; color: #8a6a4f; }
      #app-splash .sp-feats { display: grid; gap: 7px; margin-top: 12px; }
      #app-splash .sp-feat { font-size: 13px; color: #7d5f45; background: rgba(255,255,255,.55);
        border: 1px solid #eadbc8; border-radius: 999px; padding: 6px 16px; }
      #app-splash .sp-feats .sp-feat:nth-child(2) { animation-delay: .12s; }
      #app-splash .sp-feats .sp-feat:nth-child(3) { animation-delay: .24s; }
      #app-splash .sp-quote { font-size: 12px; color: #a98d74; font-style: italic; margin-top: 10px; }
      #app-splash .sp-dots { display: flex; gap: 6px; margin-top: 8px; }
      #app-splash .sp-dots i { width: 7px; height: 7px; border-radius: 50%; background: #e0a274;
        animation: sp-dot 1.2s ease-in-out infinite; }
      #app-splash .sp-dots i:nth-child(2) { animation-delay: .15s; }
      #app-splash .sp-dots i:nth-child(3) { animation-delay: .3s; }
      #app-splash .sp-in { animation: sp-in .5s ease both; }
      #app-splash .sp-quote { animation-delay: .34s; }
      @keyframes sp-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      @keyframes sp-dot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
      @keyframes sp-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .sp-paw, #app-splash .sp-dots i, #app-splash .sp-in { animation: none; }
      }
    </style>
    <div class="sp-paw">🐾</div>
    <div class="sp-name sp-in">温暖的爪印</div>
    <div class="sp-sub sp-in">Warm Paws</div>
    <div class="sp-tag sp-in">一个温柔的角落</div>
    <div class="sp-feats">
      <div class="sp-feat sp-in">🐱 亲手照顾一只小宠物</div>
      <div class="sp-feat sp-in">🌊 把心事装进漂流瓶</div>
      <div class="sp-feat sp-in">❤️ 在暖心墙遇见温柔的人</div>
    </div>
    <div class="sp-quote sp-in">「你已经做得比想象中好了」</div>
    <div class="sp-dots"><i></i><i></i><i></i></div>
  </div>

  <noscript>
    <h1>Warm Paws · 温暖的爪印</h1>
    <p>
      A warm, healing corner: an adorable pet to care for, hand-drawn food, a gentle daily

  <script type="module" src="/src/main.js"></script>
</body>
