<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- 轮 462：去掉 viewport-fit=cover。它在 App 里没有收益（WebView 的 env(safe-area-inset-*)
       实测恒为 0，安全区由 MainActivity 的原生值负责），却让安卓浏览器把内容铺到手势条底下
       —— 用户截图里「写点什么」被那条横线压住；iOS Safari 也会把内容顶到刘海下。
       键盘仍是 resizes-visual：布局视口不动、只有可视视口缩，让位由 --kb-h
       （src/utils/keyboardInset.js 的网页端分支）自己做。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-visual" />

  <meta
    name="description"
    content="A warm, healing corner: an adorable pet to care for, hand-drawn food, a gentle daily story and a cloud-shared kindness wall. 一个温暖的角落：养一只小宠物、手绘食物、暖心墙与温柔的每日故事。"
  />

  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.json" />
  <script>
    /* 轮 83：首帧前给 <html> 打 js 标记（内联执行，早于任何绘制）。 */
    document.documentElement.classList.add("js");
  </script>
  <script>
    /* 轮 430：首帧前就把主题挂上 <html>，否则启动页只能落到默认奶油色 ——
       Vue 起来后 uiStore 才补 data-theme，深色/彩色主题的用户先看到一片米白再跳色。
       与 stores/uiStore.js 的 THEME_KEY 同源（wp-theme）；脏值一律回 cream。 */
    (function () {
      var KEYS = ["cream", "sakura", "mint", "lavender", "night"];
      var BG = { cream: "#faf9f5", sakura: "#fdf1f6", mint: "#eefaf4", lavender: "#f5f1fc", night: "#171a33" };
      var th = "cream";
      try {
        var saved = localStorage.getItem("wp-theme");
        if (saved && KEYS.indexOf(saved) >= 0) th = saved;
      } catch (e) { /* 隐私模式读不到就用默认 */ }
      document.documentElement.dataset.theme = th;
      /* 地址栏/状态栏配色跟着主题走（网页端；App 里由原生控制） */
      var mc = document.querySelector('meta[name="theme-color"]');
      if (mc) mc.setAttribute("content", BG[th]);
    })();
  </script>
  <style>
    /* 轮 83：修「打开网页先看到一段英文占位/裸链接，才进正常页面」——构建期写进
     * #app 的 SEO 静态正文（.seo-static，见 vite.config 注入处）本来要裸露到 Vue
     * 挂载为止，CSS 慢时更是无样式裸奔。真人浏览器（有 JS）首帧前就把它隐藏，
     * 挂载后 Vue 直接接管；无 JS 的爬虫没有 js 类，占位照常可读（SEO 不受影响）。
     * 6 秒看门狗的中文兜底不带 seo-static 类，不受影响。 */
    html.js .seo-static { display: none !important; }
    /* CSS 未就绪的窗口期先铺暖底色避免白屏（style.css 就绪后无缝接管渐变） */
    html.js body { background: #faf9f5; }
  </style>
  <script>
  /* ── 启动看门狗（修「有时候页面一堆英文乱码」）──────────────────────
   * 那段英文是构建期写进 #app 的 SEO 静态占位（给搜索引擎看的）。正常情况下
   * Vue 一挂载就会整体替换掉它；但一旦 JS 资源加载失败（版本更新后旧缓存指向
   * 已删除的 chunk、弱网超时等），占位就会一直裸露在用户面前。
   * 两道保险：
   *  1) vite:preloadError（chunk 404 等）→ 自动整页重载一次（sessionStorage 防循环）；
   *  2) 6 秒后仍未挂载成功 → 把英文占位换成中文提示 + 重试按钮，不再显示英文。 */
  (function () {
    /* 轮 30 / 轮 38：启动页只在 App 里显示（网页端 display:none 保持隐藏）。
       轮 38 修正：轮 30 只看 UA 里有没有 "capacitor"，而 Capacitor Android 的 WebView
       UA **默认不含这个串**（只有 capacitor.config.json 配了 android.appendUserAgent
       才会被追加）→ html.cap-app 永远加不上 → App 端启动页凭空消失（网页端隐藏是轮 30
       要的效果，App 端是它的副作用）。
       现在解析期就尽量判（早一点显示，少闪一帧），四路任一命中即算 App：
         ① window.androidBridge / window.Capacitor（电容壳注入，最硬）
         ② capacitor.config.json 里 android.appendUserAgent 配的串（确定会被追加到 UA）
         ③ UA 里的 "capacitor"（iOS 端带它）
         ④ src/main.js 里 Capacitor.isNativePlatform()（权威兜底，挂载前补判） */
    try {
      var ua = navigator.userAgent || "";
      var looksApp = !!window.androidBridge || !!window.Capacitor ||
        /capacitor|WarmPawsApp/i.test(ua);
      if (looksApp) {
        document.documentElement.classList.add("cap-app");
      }
    } catch (e) { /* 拿不到 UA 就当网页 */ }
    var FLAG = "wp-boot-reload";
    var SOFT_MS = 12000;   /* 12s 只提示「还在加载」，不清空页面 */
    var HARD_MS = 30000;   /* 30s 仍没挂载才认定为真故障 */
    var bootErrs = (window.__bootErrs = window.__bootErrs || []);
    var pushErr = function (s) {
      s = String(s || "").slice(0, 300);
      if (!s || bootErrs.indexOf(s) >= 0 || bootErrs.length >= 6) return;
      bootErrs.push(s);
    };
    /* 资源加载失败（script/link/img）不会冒泡，必须用捕获阶段；
     * 运行时报错则走 message/filename。两路都记下来，兜底页才有据可查。 */
    function reloadOnce() {
      try {
        if (sessionStorage.getItem(FLAG)) return;   /* 已重载过一次：不再循环 */
        sessionStorage.setItem(FLAG, "1");
      } catch (e) { /* 隐私模式等拿不到 sessionStorage 就直接重载 */ }
      location.reload();
    }
    window.addEventListener("error", function (e) {
      if (e && e.target && e.target !== window && e.target.tagName) {
        var t = e.target;
        var url = t.src || t.href || "";
        pushErr("RES:" + t.tagName + " " + url);
        /* 首屏主包/依赖包被弱网掐断时，原生模块不会走 vite:preloadError；
         * 这里补一次自动重载（只限挂载前、只限 /assets/，避免聊天中误重载）。 */
        if (!window.__WP_MOUNTED__ && /\/assets\//.test(url)) reloadOnce();
      } else {
        pushErr((e && e.message || "") + " @" + String((e && e.filename) || "").split("/").pop() + ":" + ((e && e.lineno) || 0));
      }
    }, true);
    window.addEventListener("unhandledrejection", function (e) {
      pushErr("REJ:" + String(e && e.reason).slice(0, 200));
    });
    window.addEventListener("vite:preloadError", reloadOnce);
    function bootCard(title, msg, hard) {
      if (window.__WP_MOUNTED__) return;
      var app = document.getElementById("app");
      if (!app) return;
      if (hard) {
        /* 只有真故障才摘掉启动页，避免 12s 的「慢网络提示」挡住 App 启动页 */
        var sp = document.getElementById("app-splash");
        if (sp && sp.parentNode) sp.parentNode.removeChild(sp);
      }
      var detail = bootErrs.length
        ? '<p style="font-size:12px;color:#9a8b7d;word-break:break-all;margin:10px 0 0">' + bootErrs.join("<br>").slice(0, 400) + "</p>"
        : "";
      app.innerHTML =
        '<section style="max-width:520px;margin:16vh auto 0;padding:24px 20px;text-align:center;' +
        "font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;" +
        'color:#5b4636;background:#fffdf8;border:1px solid #eadbc8;border-radius:18px;' +
        'box-shadow:0 8px 30px rgba(90,60,30,.08)">' +
        '<h2 style="margin:0 0 10px;font-size:20px;font-weight:800">' + title + "</h2>" +
        '<p style="margin:0;font-size:14px;line-height:1.7">' + msg + "</p>" +
        detail +
        '<p style="margin:14px 0 0"><a href="javascript:location.reload()" style="color:#e07a3f;font-weight:700;text-decoration:none">' +
        "\u70b9\u8fd9\u91cc\u91cd\u8bd5</a></p></section>";
    }
    setTimeout(function () {
      /* 12s：没挂载 → 只提示「网络慢，还在加载」，保留启动页。
       * 不按 bootErrs 判——楷体 CDN/图标 404 这类非关键资源失败也会进 bootErrs，
       * 不能因此把「慢网络」误判成真故障。 */
      if (!window.__WP_MOUNTED__) {
        bootCard("\u{1F43E} 温暖的爪印", "网络有点慢，正在继续加载…", false);
      }
    }, SOFT_MS);
    setTimeout(function () {
      /* 30s：真故障或资源确实没到，才换掉整页并显示错误摘要 */
      if (window.__WP_MOUNTED__) return;
      bootCard(
        "\u{1F43E} 温暖的爪印",
        "页面加载遇到了一点小麻烦，内容没有起来。",
        true
      );
    }, HARD_MS);
  })();
  </script>

  <!-- 轮 437b：中文字体回退到原来的加载方式 —— 走 CDN，**不进安装包**。
       轮 436 把楷体也塞进了包（603KB → 后来 3.4MB），APK 从 6.8MB 涨到 9.7MB；
       用户问「字体以前就有，为什么占这么大体积」—— 因为以前它是网页从 CDN 拉的，包内没有。
       现在包内只留 41KB 的西文 Reddit Sans（这个是真优化：可变字重解决了英文合成加粗），
       楷体回到 jsdelivr，和轮 406 之前完全一样。
       只引 regular + bold 两套（原包 style.css 会把 light/mono 一起 import，多 400KB 无用 CSS；
       项目里没有 300 字重的用法，去掉不影响任何一页的观感）。 -->
  <link rel="preload" href="/fonts/reddit-sans.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css" media="print" onload="this.media='all'" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css" media="print" onload="this.media='all'" />
  <noscript>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-bold.css" />

</head>
<body>
  <div id="app"></div>

  <!-- 轮 24：启动页（静态层，不依赖 Vue）——覆盖「原生 splash 结束 → Vue 挂载 + 云端会话就绪」的白屏窗口。
       App.vue 在云端就绪（或 2.5s 兜底）并预热完会话缓存后加 .out 淡出移除；
       启动看门狗触发时会先摘掉它再放中文提示，避免提示被挡。 -->
  <div id="app-splash" aria-hidden="true">
    <style>
      /* 轮 38：这一块原来是坏的——轮 30 在样式块中间插入了一个 style 结束标签，把唯一的
       * 样式块提前闭合，后面 30 行 CSS 全成了「裸文本」（根本不在 style 元素里）。于是唯一
       * 生效的规则是 display:none → 启动页在 App 里也永远不显示，而 html.cap-app ...
       * display:flex 那条也一起变成了死文本（这才是「App 端启动页又没了」的真因）。
       * 现在合成一个合法样式块，顺序是有意的：
       *   ① 布局（这里不写 display）→ ② 默认隐藏（网页端不闪）→ ③ App 壳恢复显示（优先级更高）
       * 注意：注释里**不能出现**字面的 style 结束标签——HTML 解析器在 style 元素里见到它就
       * 立刻结束元素（注释也不豁免），splash-test ⑥/⑦ 就是守这个的。 */
      /* 轮 430：启动页随主题（五套）——奶油 / 樱花 / 薄荷 / 薰衣草 / 星夜。
         每套 = 背景渐变 + 柔光斑 + 粒子（花瓣 / 气泡 / 星点 / 暖尘）+ 专属图标与文字色；
         DOM 与下面的 i18n 文本替换脚本一行不动，全靠 html[data-theme] 覆盖。
         data-theme 由 <head> 里的内联脚本在首帧前写好（否则永远只画默认奶油色）。 */
      #app-splash { position: fixed; inset: 0; z-index: 9999; flex-direction: column;
        align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center;
        overflow: hidden; transition: opacity .4s ease; color: #6b4a32;
        /* 启动页不要触发楷体下载：603KB 的 CDN 字体会和主 JS 抢首屏带宽 */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        /* ① 暖奶油（默认）：米白 + 一束顶光，不是一块死板纯色 */
        background:
          radial-gradient(120% 78% at 50% -6%, #ffdcc7 0%, rgba(253,242,231,.92) 40%, rgba(250,249,245,0) 74%),
          #faf9f5; }
      #app-splash { display: none; }
      /* html.cap-app 由 index.html 内联脚本 + src/main.js 的 Capacitor.isNativePlatform() 加上 */
      html.cap-app #app-splash { display: flex; }
      #app-splash.out { opacity: 0; pointer-events: none; }

      /* —— 视觉层：柔光斑 + 粒子（五套共用骨架，主题只换形状 / 颜色 / 动画） —— */
      #app-splash .sp-glow, #app-splash .sp-deco { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
      #app-splash .sp-glow b { position: absolute; display: block; border-radius: 50%; filter: blur(48px); }
      #app-splash .sp-glow b:nth-child(1) { width: 220px; height: 220px; top: -64px; left: -66px; background: rgba(233,152,112,.5); }
      #app-splash .sp-glow b:nth-child(2) { width: 190px; height: 190px; bottom: -58px; right: -54px; background: rgba(240,178,142,.44); }
      #app-splash .sp-glow b:nth-child(3) { width: 150px; height: 150px; top: 44%; right: -74px; background: rgba(255,214,190,.5); }
      /* 位置表：五套共用，摊在四周，避开中间文字 */
      #app-splash .sp-deco i { position: absolute; display: block; width: 6px; height: 6px; border-radius: 50%;
        background: rgba(204,120,92,.5); opacity: .6; animation: sp-twinkle 4.4s ease-in-out infinite; }
      #app-splash .sp-deco i:nth-child(1) { top: 14%; left: 12%; animation-delay: -.3s; }
      #app-splash .sp-deco i:nth-child(2) { top: 23%; right: 13%; animation-delay: -1.2s; }
      #app-splash .sp-deco i:nth-child(3) { top: 37%; left: 7%; animation-delay: -2.1s; }
      #app-splash .sp-deco i:nth-child(4) { top: 54%; right: 9%; animation-delay: -.7s; }
      #app-splash .sp-deco i:nth-child(5) { bottom: 26%; left: 15%; animation-delay: -1.7s; }
      #app-splash .sp-deco i:nth-child(6) { bottom: 15%; right: 17%; animation-delay: -2.8s; }
      #app-splash .sp-deco i:nth-child(7) { top: 8%; left: 46%; animation-delay: -3.5s; }
      #app-splash .sp-deco i:nth-child(8) { bottom: 8%; left: 41%; animation-delay: -1.5s; }

      /* —— 文字层（默认 cream 配色；主题在下面覆盖） —— */
      #app-splash .sp-paw { position: relative; font-size: 56px; line-height: 1.1;
        animation: sp-breathe 1.6s ease-in-out infinite; }
      #app-splash .sp-name { position: relative; font-size: 22px; font-weight: 800; color: #6b4a32; }
      #app-splash .sp-sub { position: relative; font-size: 12px; color: #a98d74; letter-spacing: 2px; }
      #app-splash .sp-tag { position: relative; font-size: 13px; color: #8a6a4f; }
      #app-splash .sp-feats { position: relative; display: grid; gap: 7px; margin-top: 12px; }
      #app-splash .sp-feat { font-size: 13px; color: #7d5f45; background: rgba(255,255,255,.58);
        border: 1px solid #eadbc8; border-radius: 999px; padding: 6px 16px; }
      #app-splash .sp-feats .sp-feat:nth-child(2) { animation-delay: .12s; }
      #app-splash .sp-feats .sp-feat:nth-child(3) { animation-delay: .24s; }
      #app-splash .sp-quote { position: relative; font-size: 12px; color: #a98d74; font-style: italic; margin-top: 10px; }
      #app-splash .sp-dots { position: relative; display: flex; gap: 6px; margin-top: 8px; }
      #app-splash .sp-dots i { width: 7px; height: 7px; border-radius: 50%; background: #e0a274;
        animation: sp-dot 1.2s ease-in-out infinite; }
      #app-splash .sp-dots i:nth-child(2) { animation-delay: .15s; }
      #app-splash .sp-dots i:nth-child(3) { animation-delay: .3s; }
      #app-splash .sp-in { animation: sp-in .5s ease both; }
      #app-splash .sp-quote { animation-delay: .34s; }
      @keyframes sp-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
      @keyframes sp-dot { 0%, 100% { opacity: .25; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
      @keyframes sp-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes sp-twinkle { 0%, 100% { opacity: .25; transform: scale(.7); } 50% { opacity: 1; transform: scale(1.15); } }
      @keyframes sp-drift { 0%, 100% { transform: translate3d(0,0,0) rotate(0deg); } 50% { transform: translate3d(12px,-18px,0) rotate(24deg); } }
      @keyframes sp-rise { 0% { transform: translateY(16px) scale(.82); opacity: 0; } 35% { opacity: .95; } 100% { transform: translateY(-48px) scale(1.16); opacity: 0; } }

      /* ═══ ② 樱花粉：飘落花瓣 + 粉调文字 ═══ */
      html[data-theme="sakura"] #app-splash {
        background: linear-gradient(168deg, #fff0f5 0%, #ffe4ee 36%, #fdf0ff 72%, #eef4ff 100%); color: #5a3a46; }
      html[data-theme="sakura"] #app-splash .sp-glow b:nth-child(1) { background: rgba(255,166,199,.55); }
      html[data-theme="sakura"] #app-splash .sp-glow b:nth-child(2) { background: rgba(214,178,255,.4); }
      html[data-theme="sakura"] #app-splash .sp-glow b:nth-child(3) { background: rgba(255,211,226,.55); }
      html[data-theme="sakura"] #app-splash .sp-deco i { width: 12px; height: 12px; opacity: .95;

  <script>
    /* 轮 74：启动页语言跟随——静态层在 i18n 之外，渲染时直接判：
     * 手动选过语言（wp-lang 存档）优先，否则一律英文（轮 456：首启默认英文，不再跟随系统语言，
     * 与 src/i18n.js 的 locale 初值同一口径）。
     * 放在启动页标记之后：解析器同步执行，首帧前完成替换，不会闪中文。 */
    (function () {
      try {
        var saved = null;
        try { saved = localStorage.getItem("wp-lang"); } catch (e) {}
        var lang = saved || "en";
        if (lang !== "en") return;
        var set = function (sel, text) { var el = document.querySelector("#app-splash " + sel); if (el) el.textContent = text; };
        set(".sp-name", "Warm Paws");
        set(".sp-sub", "A gentle place to be");
        set(".sp-tag", "A gentle corner");
        var feats = document.querySelectorAll("#app-splash .sp-feat");
        if (feats[0]) feats[0].textContent = "🐱 Care for a little pet";
        if (feats[1]) feats[1].textContent = "🌊 Bottle up your thoughts";
        if (feats[2]) feats[2].textContent = "❤️ Meet gentle people on the Wall";
        set(".sp-quote", "「You’re doing better than you think.」");
      } catch (e) { /* 任何异常保持中文默认 */ }
    })();
  </script>
