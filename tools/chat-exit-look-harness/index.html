<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>exit harness</title>
</head>
<body>
  <div class="shell shell--mobile-nav shell--chat" id="shell">
    <header class="topbar">
      <span class="brand"><span class="brand-paw">🐾</span><span class="brand-text"><strong>陪伴</strong><small>慢慢来</small></span></span>
    </header>
    <main>
      <div class="dm-page dm-page--chat" id="page">
        <div class="dm-wrap">
          <aside class="card dm-list" id="list" style="display:none"></aside>
          <section class="card dm-thread" id="thread">
            <div class="dm-thread-head"><span>会话</span></div>
            <div class="dm-scroll" id="scroll"><div style="height:1800px"></div></div>
            <div class="dm-foot" id="foot" style="height:56px;background:#f2eee6">输入条</div>
          </section>
        </div>
      </div>
    </main>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
